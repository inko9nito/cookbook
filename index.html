<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- the app fonts (Nunito for text, Fredoka for titles and buttons: src/theme/cookbook.css): fetched first, so the
         first paint is already in them -->
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cookbook" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <title>Cookbook</title>
    <!--
      The launch loader: the app icon's cooking pot, its lid rattling as if something is boiling (approved exception,
      see CLAUDE.md). It's plain HTML and CSS here, so it shows on the first paint, before the app's code has loaded, and
      keeps moving while that code starts up: only transform and opacity animate, on whole <svg> elements (the pot, the
      lid and two wisps of steam, stacked on one 28 x 32 grid: Lucide's 24px grid with room around it for the steam), so
      the phone can run it off the main thread. hideLaunchLoader() (src/data/launch.ts) fades it out once the first
      screen has something to show. ?loader keeps it on screen to look at; ?loader=slow plays it at a quarter speed.

      The rhythm, over one 2.2s loop: a small hop, a pause, the big one (the lid lifts on its right, pivoting on its left
      end, hangs a moment, drops, and bounces twice as it settles, while the pot takes the knock and steam escapes), a
      last small hop, then a longer pause while the pressure builds again. Going up eases out (pushed, then slowing);
      coming down eases in (gravity), so each landing hits hard.
    -->
    <style>
      #app { isolation: isolate; } /* the app's own layers stay under the loader, which comes after it */
      .ck-launch {
        --ck-boil: 2.2s;
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 8vh; /* a little above the middle, where the eye expects it */
        background: var(--ck-bg, #f5f5f5);
        transition: opacity 0.25s ease-out;
      }
      .ck-launch.ck-launch-done { opacity: 0; pointer-events: none; }
      .ck-launch-stage { position: relative; width: 112px; height: 128px; }
      :where(.ck-launch-stage) svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: var(--ck-boil) 0.2s infinite both;
      }
      .ck-launch-pot { stroke: var(--ck-accent, #e4572e); animation-name: ck-pot; }
      /* the lid's left end, (4, 8) on Lucide's grid, is the hinge */
      .ck-launch-lid { stroke: var(--ck-accent, #e4572e); transform-origin: 21.43% 50%; animation-name: ck-lid; }
      .ck-launch-steam { stroke: var(--ck-strong, #c9c9ce); opacity: 0; transform-origin: 82% 37.5%; animation-name: ck-steam; }
      .ck-launch-steam + .ck-launch-steam { transform-origin: 91% 40%; animation-name: ck-steam-late; }
      @keyframes ck-lid {
        0%    { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0.25, 0.8, 0.35, 1); }
        6%    { transform: translateY(-2.5%) rotate(-5deg); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5); }
        12%   { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0.25, 0.8, 0.35, 1); }
        15%   { transform: translateY(-0.6%) rotate(-1deg); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5); }
        18%   { transform: translateY(0) rotate(0); }
        26%   { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0.25, 0.8, 0.35, 1); }
        35%   { transform: translateY(-7%) rotate(-12deg); animation-timing-function: ease-in-out; }
        38%   { transform: translateY(-7.4%) rotate(-12.5deg); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5); }
        45%   { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0.25, 0.8, 0.35, 1); }
        49%   { transform: translateY(-1.6%) rotate(-2.5deg); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5); }
        52.5% { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0.25, 0.8, 0.35, 1); }
        54.5% { transform: translateY(-0.4%) rotate(-0.5deg); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5); }
        56.5% { transform: translateY(0) rotate(0); }
        64%   { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0.25, 0.8, 0.35, 1); }
        68%   { transform: translateY(-2%) rotate(-3deg); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5); }
        72%, 100% { transform: translateY(0) rotate(0); }
      }
      /* the pot takes the knock of the big landing: one pixel down and back */
      @keyframes ck-pot {
        0%, 44.5% { transform: translateY(0); }
        46%       { transform: translateY(0.8%); }
        50%, 100% { transform: translateY(0); }
      }
      /* steam escapes past the lid's raised edge while it's up, then drifts off and thins out */
      @keyframes ck-steam {
        0%, 30%   { opacity: 0; transform: translateY(3%) scaleY(0.6); }
        40%       { opacity: 1; transform: translateY(-2%) scaleY(1); }
        78%, 100% { opacity: 0; transform: translateY(-13%) scaleY(1.15); }
      }
      @keyframes ck-steam-late {
        0%, 36%   { opacity: 0; transform: translateY(3%) scaleY(0.6); }
        46%       { opacity: 0.8; transform: translateY(-1%) scaleY(1); }
        84%, 100% { opacity: 0; transform: translateY(-10%) scaleY(1.1); }
      }
      @media (prefers-reduced-motion: reduce) {
        :where(.ck-launch-stage) svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ck-launch" class="ck-launch" role="progressbar" aria-label="Loading Cookbook">
      <div class="ck-launch-stage" aria-hidden="true">
        <!-- Lucide's cooking-pot (the app icon, #102), split into the pot and its lid -->
        <svg class="ck-launch-pot" viewBox="-2 -8 28 32"><path d="M2 12h20" /><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" /></svg>
        <svg class="ck-launch-lid" viewBox="-2 -8 28 32"><path d="m4 8 16-4" /><path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8" /></svg>
        <svg class="ck-launch-steam" viewBox="-2 -8 28 32"><path d="M21 4c-1.2-1.2 1.2-2.3 0-3.5s1.2-2.3 0-3.5" /></svg>
        <svg class="ck-launch-steam" viewBox="-2 -8 28 32"><path d="M23.5 5c-.9-.9.9-1.8 0-2.7s.9-1.8 0-2.7" /></svg>
      </div>
    </div>
    <script>
      // In automated checks (check:ui) the loader stays out of the way, unless the check asks for it with ?loader.
      (function () {
        var q = new URLSearchParams(location.search), el = document.getElementById('ck-launch');
        if (navigator.webdriver && !q.has('loader')) el.remove();
        else if (q.get('loader') === 'slow') el.style.setProperty('--ck-boil', '8.8s');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

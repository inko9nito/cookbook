<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- the app's font (Parkinsans, for titles and for reading: src/theme/cookbook.css): fetched first, so the first
         paint is already in it -->
    <link rel="preload" href="/fonts/parkinsans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Issue #135: another font or other sizes picked in Settings → Appearance → Font, this phone only: put on the
         page before the first paint, with its files fetched first like the one above -->
    <script src="/fonts.js"></script>
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cookbook" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <title>Cookbook</title>
    <!-- What iOS shows the moment the home-screen app is tapped, before the page has loaded: pictures of the launch
         loader below, still, one per iPhone screen. Written by `npm run launch-screens` (scripts/make-launch-screens.cjs). -->
    <!-- launch images: start -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/440x956@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/430x932@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/428x926@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/420x912@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/414x896@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/launch/414x896@2x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/414x736@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/402x874@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/393x852@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/390x844@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/launch/375x812@3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/launch/375x667@2x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/launch/320x568@2x.png" />
    <!-- launch images: end -->
    <!--
      The launch loader: the app icon's cooking pot, its lid rocking like a cartoon pot about to boil over (approved
      exception, see CLAUDE.md). It's plain HTML and CSS here, so it shows on the first paint, before the app's code has
      loaded, and keeps moving while that code starts up: only transforms animate, on whole elements (the pot, and the lid
      in two nested layers), so the phone can run it off the main thread. hideLaunchLoader() (src/data/launch.ts) fades
      it out once the first screen has something to show. ?loader keeps it on screen to look at; ?loader=slow plays it
      at a quarter speed.

      The lid sits level on the pot and rocks, one side up and then the other, over one 2.8s loop: left, right, left,
      right (the last one a bit higher), then a still moment (about 0.9s) before it starts again. Each side starts up as the other lands,
      like a seesaw, so it flows instead of ticking. The outer layer hinges on the lid's left end (it lifts the right
      side); the inner one on its right end (it lifts the left side). Up eases out, down eases in, softly; the pot squashes
      each time the lid lands and stretches back up, like a cartoon.
    -->
    <style>
      #app { isolation: isolate; } /* the app's own layers stay under the loader, which comes after it */
      .ck-launch {
        --ck-boil: 2.8s;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        /* the screen's height in the home-screen app (--ck-launch-h, set below), so the pot stays where the launch image
           has it while the page's own height settles; otherwise the page's */
        height: var(--ck-launch-h, 100%);
        box-sizing: border-box; /* the padding below is inside that height */
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: calc(var(--ck-launch-h, 100vh) * 0.08); /* a little above the middle, where the eye expects it */
        background: var(--ck-bg, #f5f5f5);
      }
      /* one 28 x 24 grid for every layer: Lucide's 24px grid with room at the sides for the lid as it tips */
      .ck-launch-stage { position: relative; width: 112px; height: 96px; }
      .ck-launch-stage div, .ck-launch-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .ck-launch-stage svg {
        overflow: visible;
        fill: none;
        stroke: var(--ck-accent, #e4572e);
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ck-launch-pot, .ck-launch-lid, .ck-launch-lid > div { animation: var(--ck-boil) 0.2s infinite both; }
      .ck-launch-pot { transform-origin: 50% 91.67%; animation-name: ck-pot; } /* squashes onto its base */
      .ck-launch-lid { transform-origin: 20.54% 39.17%; animation-name: ck-lid-right; } /* hinged on the lid's left end */
      .ck-launch-lid > div { transform-origin: 79.46% 39.17%; animation-name: ck-lid-left; } /* hinged on its right end */
      @keyframes ck-lid-left {
        0%        { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0.3, 0.7, 0.4, 1); }
        8.6%       { transform: translateY(-3%) rotate(10deg); animation-timing-function: cubic-bezier(0.55, 0, 0.8, 0.55); }
        17.3%       { transform: translateY(0) rotate(0); }
        36.1%       { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0.3, 0.7, 0.4, 1); }
        44%       { transform: translateY(-2%) rotate(7deg); animation-timing-function: cubic-bezier(0.55, 0, 0.8, 0.55); }
        51.9%, 100% { transform: translateY(0) rotate(0); }
      }
      @keyframes ck-lid-right {
        0%, 15.7%   { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0.3, 0.7, 0.4, 1); }
        24.4%       { transform: translateY(-3%) rotate(-10deg); animation-timing-function: cubic-bezier(0.55, 0, 0.8, 0.55); }
        33%       { transform: translateY(0) rotate(0); }
        50.3%       { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0.3, 0.7, 0.4, 1); }
        58.9%       { transform: translateY(-4.5%) rotate(-12deg); animation-timing-function: cubic-bezier(0.55, 0, 0.8, 0.55); }
        67.6%, 100% { transform: translateY(0) rotate(0); }
      }
      /* a cartoon squash as each side lands, then a little stretch back up before it settles; the last one the biggest */
      @keyframes ck-pot {
        0%, 16.5%     { transform: scale(1, 1); }
        18.9%         { transform: scale(1.035, 0.945); }
        22%         { transform: scale(0.99, 1.015); }
        25.1%, 32.2%    { transform: scale(1, 1); }
        34.6%         { transform: scale(1.035, 0.945); }
        37.7%         { transform: scale(0.99, 1.015); }
        40.9%, 51.1%    { transform: scale(1, 1); }
        53.4%         { transform: scale(1.025, 0.96); }
        56.6%         { transform: scale(0.995, 1.01); }
        59.7%, 66.8%    { transform: scale(1, 1); }
        69.5%       { transform: scale(1.05, 0.92); }
        73.1%         { transform: scale(0.985, 1.025); }
        76.2%, 100%   { transform: scale(1, 1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ck-launch-pot, .ck-launch-lid, .ck-launch-lid > div { animation: none; }
      }
    </style>
    <script>
      // The home-screen app's page starts out shorter than the screen (about 50 points, on an iPhone 16) and grows to
      // the full height a moment later, while it starts up. Centred on the page, the pot drew 25 points above where
      // iOS's launch image has it, then dropped back. So there, the loader is laid out on the screen's height, which
      // doesn't change. Set here, in the head, so it's in place for the first paint.
      if (navigator.standalone && innerHeight > innerWidth) {
        document.documentElement.style.setProperty('--ck-launch-h', screen.height + 'px');
        document.documentElement.dataset.ckStartHeight = String(innerHeight); // has it grown since? (src/data/launch.ts)
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="ck-launch" class="ck-launch" role="progressbar" aria-label="Loading Cookbook">
      <div class="ck-launch-stage" aria-hidden="true">
        <!-- Lucide's cooking-pot (the app icon, #102), split into the pot and its lid. The lid is turned level and set
             down onto the rim (in the icon it hangs ajar), so it can rock both ways. -->
        <svg class="ck-launch-pot" viewBox="-2 0 28 24"><path d="M2 12h20" /><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" /></svg>
        <div class="ck-launch-lid"><div><svg viewBox="-2 0 28 24"><g transform="translate(0 3.4) rotate(14.04 12 6)"><path d="m4 8 16-4" /><path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8" /></g></svg></div></div>
      </div>
    </div>
    <script>
      // In automated checks (check:ui) the loader stays out of the way, unless the check asks for it with ?loader.
      (function () {
        var q = new URLSearchParams(location.search), el = document.getElementById('ck-launch');
        if (navigator.webdriver && !q.has('loader')) el.remove();
        else if (q.get('loader') === 'slow') el.style.setProperty('--ck-boil', '11.2s');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

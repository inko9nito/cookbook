[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Issue #141: the trials' addresses (/next/, /ionic/) open the app, which is now on Ionic, so a Home Screen icon made
# for the trial still works
[[redirects]]
  from = "/ionic/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/next/*"
  to = "/:splat"
  status = 301

# Single-page app: every path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Which build is live (builds before issue #91 read it to see whether the app on the phone is behind): never cached
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

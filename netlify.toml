[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Issue #141: the app without Framework7 (a trial): its screens' addresses serve its own page
[[redirects]]
  from = "/next/*"
  to = "/next/index.html"
  status = 200

# Single-page app: every path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Which build is live (builds before issue #91 read it to see whether the app on the phone is behind): never cached
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

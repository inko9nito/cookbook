[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Which build is live (src/lib/appUpdate.ts reads it to see whether the app on the phone is behind): never cached
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
